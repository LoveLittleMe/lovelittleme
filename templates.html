<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Wound — Love Little Me</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg-deep:    #0E0A02;
    --bg-dark:    #1C1408;
    --bg-mid:     #221A08;
    --bg-card:    #1A1206;
    --gold:       #C9960C;
    --gold-light: #E3B84A;
    --gold-dim:   #8A650A;
    --cream:      #F5E4B0;
    --cream-dim:  #C4B48A;
    --cream-faint:#7A6A50;
    --white:      #FDF8F0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-deep);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 1000;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 1.5rem;
    background: linear-gradient(to bottom, rgba(14,10,2,0.97) 0%, transparent 100%);
  }

  .nav-logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--cream);
    text-decoration: none;
  }

  .nav-logo span { color: var(--gold); }

  .nav-step {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cream-faint);
  }

  .nav-step strong {
    color: var(--gold);
  }

  /* ── HERO ── */
  .page-hero {
    padding: 7rem 1.5rem 3rem;
    text-align: center;
    position: relative;
  }

  .page-hero::after {
    content: '';
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    width: min(600px, 100vw);
    height: 300px;
    background: radial-gradient(ellipse, rgba(201,150,12,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .step-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  .step-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-dim);
  }

  .step-dot.active {
    background: var(--gold);
    box-shadow: 0 0 8px rgba(201,150,12,0.5);
  }

  .step-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .page-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 300;
    line-height: 1.1;
    color: var(--cream);
    margin-bottom: 0.8rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.25s forwards;
  }

  .page-subtitle {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-style: italic;
    color: var(--cream-dim);
    max-width: 480px;
    margin: 0 auto;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  /* ── GRID ── */
  .templates-section {
    padding: 3rem 1.5rem 6rem;
    max-width: 1000px;
    margin: 0 auto;
  }

  .templates-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1px;
    background: rgba(245,228,176,0.05);
    border: 1px solid rgba(245,228,176,0.05);
    border-radius: 4px;
    overflow: hidden;
  }

  .wound-card {
    background: var(--bg-card);
    padding: 2rem 1.8rem;
    cursor: pointer;
    transition: background 0.25s ease;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .wound-card:nth-child(1) { animation-delay: 0.5s; }
  .wound-card:nth-child(2) { animation-delay: 0.6s; }
  .wound-card:nth-child(3) { animation-delay: 0.7s; }
  .wound-card:nth-child(4) { animation-delay: 0.8s; }
  .wound-card:nth-child(5) { animation-delay: 0.9s; }
  .wound-card:nth-child(6) { animation-delay: 1.0s; }
  .wound-card:nth-child(7) { animation-delay: 1.1s; }

  /* Gold left border on hover */
  .wound-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--gold);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.35s ease;
  }

  /* Subtle glow bg on hover */
  .wound-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 20% 50%, rgba(201,150,12,0.04) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .wound-card:hover { background: #1E1508; }
  .wound-card:hover::before { transform: scaleY(1); }
  .wound-card:hover::after { opacity: 1; }
  .wound-card:hover .card-arrow { transform: translateX(4px); opacity: 1; }
  .wound-card:hover .wound-name { color: var(--cream); }

  .card-left { position: relative; z-index: 1; }

  .wound-icon {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    margin-bottom: 0.6rem;
    display: block;
  }

  .modal-icon {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.25em;
    color: var(--gold-dim);
    margin-bottom: 1rem;
    display: block;
  }

  .wound-number {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .wound-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 500;
    color: var(--cream-dim);
    margin-bottom: 0.4rem;
    line-height: 1.2;
    transition: color 0.25s ease;
  }

  .wound-tagline {
    font-size: 0.82rem;
    color: var(--cream-faint);
    line-height: 1.65;
    max-width: 480px;
  }

  .card-right {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
    flex-shrink: 0;
  }

  .card-arrow {
    width: 28px;
    height: 28px;
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, opacity 0.25s ease;
    opacity: 0.5;
    color: var(--gold);
    font-size: 0.8rem;
  }

  .card-price {
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }

  .coming-soon-card {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }

  .coming-soon-card:hover { background: var(--bg-card); }

  .coming-badge {
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream-faint);
    border: 1px solid rgba(245,228,176,0.1);
    padding: 0.2rem 0.5rem;
    border-radius: 2px;
  }

  /* ── DETAIL MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 7, 1, 0.9);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--bg-dark);
    border: 1px solid rgba(245,228,176,0.08);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    width: 100%;
    max-width: 640px;
    padding: 2.5rem 2rem 3rem;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    max-height: 90svh;
    overflow-y: auto;
  }

  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 36px;
    height: 3px;
    background: rgba(245,228,176,0.15);
    border-radius: 2px;
    margin: 0 auto 2rem;
  }

  .modal-icon {
    font-size: 2rem;
    display: block;
    margin-bottom: 1rem;
  }

  .modal-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .modal-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    font-weight: 400;
    color: var(--cream);
    line-height: 1.15;
    margin-bottom: 1rem;
  }

  .modal-desc {
    font-size: 0.9rem;
    color: var(--cream-dim);
    line-height: 1.8;
    margin-bottom: 2rem;
  }

  /* Affirmations preview */
  .modal-affirmations {
    margin-bottom: 2rem;
  }

  .affirmations-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-bottom: 0.8rem;
  }

  .affirmation-item {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin-bottom: 0.7rem;
  }

  .affirmation-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--gold);
    margin-top: 0.55rem;
    flex-shrink: 0;
  }

  .affirmation-text {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    font-style: italic;
    color: var(--cream-dim);
    line-height: 1.5;
  }

  /* What to expect */
  .modal-expects {
    background: rgba(201,150,12,0.04);
    border: 1px solid rgba(201,150,12,0.1);
    border-radius: 4px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 2rem;
  }

  .expects-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 0.8rem;
  }

  .expect-item {
    font-size: 0.85rem;
    color: var(--cream-dim);
    margin-bottom: 0.4rem;
    padding-left: 1rem;
    position: relative;
  }

  .expect-item::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--gold-dim);
    font-size: 0.75rem;
  }

  .modal-cta {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .btn-primary {
    background: var(--gold);
    color: var(--bg-deep);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 1.1rem 2rem;
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    transition: all 0.25s ease;
    width: 100%;
  }

  .btn-primary:hover {
    background: var(--gold-light);
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(201,150,12,0.25);
  }

  .btn-ghost {
    background: transparent;
    color: var(--cream-dim);
    border: 1px solid rgba(245,228,176,0.15);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    padding: 0.9rem 2rem;
    border-radius: 2px;
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    transition: all 0.25s ease;
    width: 100%;
  }

  .btn-ghost:hover {
    border-color: var(--cream-dim);
    color: var(--cream);
  }

  /* Price line */
  .modal-price {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
  }

  .price-num {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--gold-light);
  }

  .price-detail {
    font-size: 0.75rem;
    color: var(--cream-faint);
  }

  /* Close button */
  .modal-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: transparent;
    border: 1px solid rgba(245,228,176,0.12);
    color: var(--cream-faint);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .modal-close:hover {
    border-color: var(--cream-dim);
    color: var(--cream);
  }

  /* Ornament */
  .ornament {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin: 0 auto 2rem;
    max-width: 160px;
    justify-content: center;
  }
  .ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim));
  }
  .ornament-line:last-child {
    background: linear-gradient(to left, transparent, var(--gold-dim));
  }
  .ornament-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold);
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (min-width: 600px) {
    .modal {
      border-radius: 12px;
      margin: 2rem;
      max-height: 85svh;
    }
    .modal-overlay {
      align-items: center;
    }
    .modal-cta {
      flex-direction: row;
    }
  }

  @media (min-width: 768px) {
    nav { padding: 1.5rem 3rem; }
    .templates-section { padding: 3rem 3rem 6rem; }
    .wound-card { padding: 2.2rem 2.5rem; }
  }
</style>
</head>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Love <span>Little</span> Me</a>

<!-- HERO -->

  </div>
</div>

    id: "coming",
    name: "More Coming Soon",
    tagline: "Societal wounds, social media trauma, family system wounds — expanding continuously.",
    description: "",
    affirmations: [],
    expects: [],
    coming: true
  }
];

// ── RENDER GRID ──
const grid = document.getElementById('templates-grid');

wounds.forEach((w, i) => {
  const card = document.createElement('div');
  card.className = 'wound-card' + (w.coming ? ' coming-soon-card' : '');
  card.setAttribute('role', w.coming ? 'presentation' : 'button');
  card.setAttribute('tabindex', w.coming ? '-1' : '0');
  card.innerHTML = `
    <div class="card-left">
      <p class="wound-number"></p>
      <h2 class="wound-name">${w.name}</h2>
      <p class="wound-tagline">${w.tagline}</p>
    </div>
    <div class="card-right">
      ${w.coming
        ? '<span class="coming-badge">Expanding</span>'
        : `<div class="card-arrow">→</div><span class="card-price">$29</span>`
      }
    </div>
  `;

  if (!w.coming) {
    card.addEventListener('click', () => openModal(w));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(w); });
  }

  grid.appendChild(card);
});

// ── MODAL ──
const overlay = document.getElementById('modal-overlay');
const modalClose = document.getElementById('modal-close');
const modalBack = document.getElementById('modal-back-btn');

function openModal(wound) {
  const activeWounds = wounds.filter(w => !w.coming);
  document.getElementById('modal-label').textContent = wound.name;
  document.getElementById('modal-title').textContent = wound.name;
  document.getElementById('modal-desc').textContent = wound.description;

  // Affirmations
  const affList = document.getElementById('affirmations-list');
  affList.innerHTML = wound.affirmations.map(a => `
    <div class="affirmation-item">
      <div class="affirmation-dot"></div>
      <p class="affirmation-text">${a}</p>
    </div>
  `).join('');

  // Expects
  const expList = document.getElementById('expects-list');
  expList.innerHTML = wound.expects.map(e => `
    <p class="expect-item">${e}</p>
  `).join('');

  // Store selected wound
  sessionStorage.setItem('selectedWound', wound.id);
  sessionStorage.setItem('selectedWoundName', wound.name);

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
modalBack.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

</body>
</html>
