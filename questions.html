<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Child Reflection - Love Little Me</title>
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --text-main: #3c3530;
            --text-muted: #7c726a;
            --accent: #d4a373;
            --accent-hover: #c39262;
            --border: #e6dfd5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wizard-container {
            background: var(--card-bg);
            max-width: 600px;
            width: 90%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        .step-counter {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 1.4rem;
            line-height: 1.6;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--accent);
            background-color: #fff;
        }

        textarea::placeholder {
            color: #b0a79f;
            font-style: italic;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            font-size: 1rem;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-back {
            background-color: transparent;
            color: var(--text-muted);
        }

        .btn-back:hover {
            color: var(--text-main);
        }

        .btn-next {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(212, 163, 115, 0.3);
        }

        .btn-next:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="wizard-container">
        <div class="step-counter">Step 1 of 3</div>
        <h2>Describe one or two specific moments or examples from your childhood that stand out the most regarding this wound. Focus simply on what happened.</h2>
        
        <div class="form-group">
            <textarea placeholder="Pour out whatever feels heavy right now..."></textarea>
        </div>
        
        <div class="button-group">
            <button type="button" class="btn-back">← Back</button>
            <button type="button" class="btn-next">Next →</button>
        </div>
    </div>

</body>
</html>
